apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: anytype
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: generate-keyfile
        image: mongo:7.0
        command:
        - /bin/bash
        - -c
        - |
          # Derive a deterministic keyfile from the password so it survives pod restarts
          printf '%s' "$MONGO_INITDB_ROOT_PASSWORD" | openssl dgst -sha256 -binary | base64 -w0 > /keyfile/keyfile
          chmod 400 /keyfile/keyfile
          chown 999:999 /keyfile/keyfile
        env:
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MONGO_PASSWORD
        volumeMounts:
        - name: keyfile
          mountPath: /keyfile
      containers:
      - name: mongodb
        image: mongo:7.0
        args:
        - --replSet
        - rs0
        - --bind_ip_all
        - --keyFile
        - /etc/mongodb/keyfile
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MONGO_PASSWORD
        ports:
        - containerPort: 27017
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                for i in $(seq 1 60); do
                  if mongosh --host localhost:27017 \
                    -u root -p "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.adminCommand('ping')" --quiet 2>/dev/null; then
                    break
                  fi
                  sleep 2
                done
                mongosh --host localhost:27017 \
                  -u root -p "$MONGO_INITDB_ROOT_PASSWORD" \
                  --authenticationDatabase admin \
                  --eval "
                    try {
                      rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb-0.mongodb:27017'}]})
                    } catch(e) { }
                  " 2>/dev/null || true
        readinessProbe:
          exec:
            command:
            - mongosh
            - --host
            - localhost:27017
            - --eval
            - "db.adminCommand('ping')"
            - --quiet
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data/db
        - name: keyfile
          mountPath: /etc/mongodb
          readOnly: true
      volumes:
      - name: keyfile
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
