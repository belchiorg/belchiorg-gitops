apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: anytype
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      initContainers:
      # Wait for MongoDB replica set to have a primary before running confapply
      - name: wait-for-mongodb
        image: mongo:7.0
        command:
        - /bin/bash
        - -c
        - |
          until mongosh --host mongodb-0.mongodb:27017 \
            -u root -p "$MONGO_PASSWORD" \
            --authenticationDatabase admin \
            --eval "rs.isMaster().ismaster" --quiet 2>/dev/null | grep -q "true"; do
            echo "Waiting for MongoDB primary..."
            sleep 5
          done
          echo "MongoDB primary is ready."
        env:
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MONGO_PASSWORD
      # Bootstrap: applies network config to MongoDB (equivalent to any-sync-coordinator_bootstrap in docker-compose)
      - name: bootstrap
        image: ghcr.io/anyproto/any-sync-coordinator:latest
        command:
        - /bin/any-sync-confapply
        - -c
        - /etc/any-sync-coordinator/config.yml
        - -n
        - /etc/any-sync-coordinator/network.yml
        - -e
        volumeMounts:
        - name: config
          mountPath: /etc/any-sync-coordinator
      containers:
      - name: coordinator
        image: ghcr.io/anyproto/any-sync-coordinator:latest
        args:
        - "-c"
        - "/etc/any-sync-coordinator/config.yml"
        ports:
        - name: drpc-tcp
          containerPort: 33010
          hostPort: 33010
          protocol: TCP
        - name: drpc-udp
          containerPort: 33020
          hostPort: 33020
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/any-sync-coordinator
      volumes:
      - name: config
        secret:
          secretName: anytype-configs
          items:
          - key: any-sync-coordinator.yml
            path: config.yml
          - key: any-sync-coordinator-network.yml
            path: network.yml
