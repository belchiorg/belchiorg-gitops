apiVersion: apps/v1
kind: Deployment
metadata:
  name: filenode
  namespace: anytype
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filenode
  template:
    metadata:
      labels:
        app: filenode
    spec:
      initContainers:
      - name: create-bucket
        image: minio/mc:latest
        command:
        - /bin/sh
        - -c
        - |
          until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
            echo "Waiting for MinIO..."
            sleep 3
          done
          mc mb --ignore-existing local/anytype
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MINIO_ACCESS_KEY
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MINIO_SECRET_KEY
      containers:
      - name: filenode
        image: ghcr.io/anyproto/any-sync-filenode:latest
        command:
        - /usr/bin/any-sync-filenode
        args:
        - "-c"
        - "/etc/any-sync-filenode/config.yml"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MINIO_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: anytype-configs
              key: MINIO_SECRET_KEY
        ports:
        - name: drpc-tcp
          containerPort: 33012
          hostPort: 33012
          protocol: TCP
        - name: drpc-udp
          containerPort: 33022
          hostPort: 33022
          protocol: UDP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/any-sync-filenode
      volumes:
      - name: config
        secret:
          secretName: anytype-configs
          items:
          - key: any-sync-filenode.yml
            path: config.yml
